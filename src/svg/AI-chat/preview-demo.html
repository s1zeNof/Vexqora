<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Vexqora — AI Chat Drone Preview</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#e6fff4;background:#091411}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(100%,660px);background:#0f201a;border:1px solid #254137;border-radius:22px;overflow:hidden;box-shadow:0 20px 80px #0006}.head{display:flex;gap:11px;align-items:center;padding:18px 22px;border-bottom:1px solid #274638}.mark{width:34px;height:34px;object-fit:contain}.head strong{font-size:17px}.sub{font-size:12px;color:#a5c4b7}.messages{height:390px;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:16px}.bubble{padding:12px 15px;border-radius:14px;line-height:1.55;max-width:87%}.user{background:#214637;align-self:flex-end}.answer{background:#182c24;align-self:flex-start;white-space:pre-wrap}.pending{align-self:flex-start;display:flex;align-items:center;gap:8px;padding:10px 14px;background:#182c24;border-radius:16px}.animated-logo{width:118px;height:99px;object-fit:contain;flex-shrink:0}.status{font-size:12px;color:#b1cfc1}.controls{border-top:1px solid #274638;padding:16px;display:grid;gap:12px}.inputRow{display:flex;gap:10px}.inputRow input{flex:1;min-width:0;background:#0b1914;color:#e6fff4;border:1px solid #315442;border-radius:12px;padding:13px 15px;font-size:14px}.inputRow button{background:#42f5b9;color:#062119;border:0;border-radius:12px;padding:0 17px;font-weight:750;cursor:pointer}.inputRow button:disabled{opacity:.5;cursor:not-allowed}.range{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#a5c4b7;font-size:12px}.range input{width:55%;accent-color:#42f5b9}.caption{padding:0 16px 14px;font-size:11px;color:#88a79b}
</style></head><body><main class="shell"><div class="head"><img class="mark" src="./vexqora-logo-static.svg" alt=""/><div><strong>Vexqora AI — demo</strong><div class="sub">Симулятор затримки відповіді, без API</div></div></div><div class="messages" id="messages"><div class="answer bubble">Напиши повідомлення, щоб побачити повний цикл: лого → дрон → thinking → лого → відповідь.</div></div><div class="controls"><label class="range">Час симульованої відповіді: <span id="ms">6000 мс</span><input id="delay" type="range" min="300" max="18000" step="100" value="6000"/></label><div class="inputRow"><input id="text" placeholder="Запитай щось у Vexqora AI" value="Проаналізуй BTC/USDT"/><button id="send">Надіслати</button></div></div><div class="caption">Файли SVG використовуються напряму через &lt;img&gt;, анімація не є PNG/GIF. Демонстрація не надсилає мережеві запити.</div></main>
<script>
const animations={idle:'vexqora-logo-static.svg',entering:'vexqora-logo-to-drone.svg',thinking:'vexqora-drone-thinking-loop.svg',exiting:'vexqora-drone-to-logo.svg'};
const ENTER_MS=2800,EXIT_MS=2200;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const messages=document.getElementById('messages'), button=document.getElementById('send'), input=document.getElementById('text'),delay=document.getElementById('delay'),ms=document.getElementById('ms');
delay.oninput=()=>ms.textContent=delay.value+' мс';
function bubble(text,cls){const d=document.createElement('div');d.className=cls+' bubble';d.textContent=text;messages.append(d);messages.scrollTop=messages.scrollHeight;return d}
function phase(img,status,state){const next=img.cloneNode(false); next.src='./'+animations[state];next.alt=''; img.replaceWith(next); status.textContent=state==='entering'?'Формування дрона…':state==='thinking'?'ШІ аналізує…':state==='exiting'?'Повернення у логотип…':'Готово';return next}
async function submit(){if(button.disabled)return;button.disabled=true;input.disabled=true;const q=input.value.trim()||'Привіт';bubble(q,'user');const shell=document.createElement('div');shell.className='pending';let img=document.createElement('img');img.className='animated-logo'; const status=document.createElement('span');status.className='status';shell.append(img,status);messages.append(shell);img=phase(img,status,'entering');messages.scrollTop=messages.scrollHeight;
let responseReady=false;let responseText='';const fakeApi=wait(Number(delay.value)).then(()=>{responseReady=true;responseText=`Демо-відповідь Vexqora AI на запит: «${q}».\n\nВідповідь показана лише після завершення SVG drone-to-logo.`;return responseText});
await wait(ENTER_MS);
if(!responseReady){img=phase(img,status,'thinking');responseText=await fakeApi}else{responseText=await fakeApi}
img=phase(img,status,'exiting');await wait(EXIT_MS);img=phase(img,status,'idle');shell.remove();bubble(responseText,'answer');button.disabled=false;input.disabled=false;input.focus()}
button.onclick=submit;input.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
</script></body></html>
