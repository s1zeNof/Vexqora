<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="420" viewBox="200 90 500 420" version="1.1" role="img" aria-labelledby="title description"><title id="title">Vexqora | Drone Thinking Loop</title><desc id="description">Loops for as long as needed: the Vexqora pixel drone gently hovers, breathes, blinks and spins propeller bars.</desc><defs>
 <clipPath id="drone-silhouette">
  <path d="M-98,-38H-80V-50H-56V-59H60V-50H82V-38H98V-20H110V18H98V37H82V49H57V56H-54V49H-80V37H-97V20H-110V-20H-98Z"/>
 </clipPath>
 <clipPath id="drone-stripes">
  <path d="M-98,-38H-80V-50H-56V-59H60V-50H82V-38H98V-20H110V18H98V37H82V49H57V56H-54V49H-80V37H-97V20H-110V-20H-98Z"/>
 </clipPath>
</defs>
<ellipse cx="450" cy="425" rx="83" ry="11" fill="#95A8A1" opacity="0.23" id="drone-shadow">
 <animate attributeName="rx" dur="2.4s" values="83;74;83" keyTimes="0;0.5;1" calcMode="linear" repeatCount="indefinite" fill="remove"/></ellipse>
<g id="vexqora-drone" transform="translate(450 309)" opacity="1">
<g id="hover-motion">
 <g id="breathing-body">
  <!-- integrated drone body, stripe language lifted directly from Vexqora logo -->
  <g clip-path="url(#drone-stripes)">
   <path d="M-120 -78H125V75H-120Z" fill="#27D8A0"/>
   <!-- three hard-edged diagonal panels separated by fine off-white slits -->
   <path d="M-114 -75H-68L1 75H-42Z" fill="#1EB885"/>
   <path d="M-60 -75H-14L58 75H15Z" fill="#42F5B9"/>
   <path d="M-3 -75H42L117 75H73Z" fill="#1EB885"/>
   <path d="M-64 -75H-56L15 75H7Z" fill="#F8F6F0"/>
   <path d="M-6 -75H2L74 75H66Z" fill="#F8F6F0"/>
   <!-- subtle pixel highlights retain the form-from-pixels aesthetic -->
   <g fill="#42F5B9" opacity=".18" shape-rendering="crispEdges">
    <rect x="-90" y="-20" width="12" height="12"/><rect x="-78" y="-8" width="12" height="12"/>
    <rect x="-25" y="35" width="12" height="12"/><rect x="45" y="-44" width="12" height="12"/>
    <rect x="80" y="12" width="12" height="12"/>
   </g>
  </g>
  <!-- square eyes; tiny blink once per idling stretch -->
  <g fill="#1F2425" shape-rendering="crispEdges">
    <rect x="-32" y="-8" width="12" height="24"><animate attributeName="height" dur="2.4s" values="24;24;3;24;24" keyTimes="0;0.58;0.595;0.61;1" calcMode="linear" repeatCount="indefinite" fill="remove"/></rect>
    <rect x="29" y="-8" width="12" height="24"><animate attributeName="height" dur="2.4s" values="24;24;3;24;24" keyTimes="0;0.58;0.595;0.61;1" calcMode="linear" repeatCount="indefinite" fill="remove"/></rect>
  </g>
 <animateTransform attributeName="transform" type="scale" dur="2.4s" values="1;1.035;1" keyTimes="0;0.5;1" calcMode="linear" repeatCount="indefinite"/></g>
 <!-- rotor connectors left and right -->
 <path d="M-96 -12H-147V-26" fill="none" stroke="#1F2425" stroke-width="11" stroke-linecap="square"/>
 <path d="M96 -12H147V-26" fill="none" stroke="#1F2425" stroke-width="11" stroke-linecap="square"/>
 <rect x="-171" y="-30" width="48" height="17" rx="4" fill="#1F2425"/>
 <rect x="123" y="-30" width="48" height="17" rx="4" fill="#1F2425"/>
 <g id="rotor-blades" fill="#A6EED6">
  <rect x="-189" y="-58" rx="10" width="83" height="16">
    <animate attributeName="width" dur="0.32s" values="83;64;83" keyTimes="0;0.5;1" calcMode="linear" repeatCount="indefinite" fill="remove"/></rect>
  <rect x="106" y="-58" rx="10" width="83" height="16">
    <animate attributeName="width" dur="0.32s" values="83;64;83" keyTimes="0;0.5;1" calcMode="linear" repeatCount="indefinite" fill="remove"/></rect>
 </g>
<animateTransform attributeName="transform" type="translate" dur="2.4s" values="0 0;0 -8;0 0" keyTimes="0;0.5;1" calcMode="linear" additive="replace" repeatCount="indefinite" fill="remove"/></g>
</g>
<g id="air-flow-lines" stroke="#242827" fill="none" stroke-width="4.2" stroke-linecap="round" opacity="0.7">
